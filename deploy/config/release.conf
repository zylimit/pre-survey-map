# ─────────────────────────────────────────────────────────────────────────────
# release.conf —— 版本/镜像/默认 scope 的【单一真源】（DEPLOY-DESIGN §3 / §6）
# 界面版本号(__APP_VERSION__ / web/package.json)未来也从这取，消除手改多处不一致。
# 改版本只改这里。子命令 --version 可临时覆盖 VERSION。
# ─────────────────────────────────────────────────────────────────────────────

# 当前发布版本（带 v 前缀；镜像 tag 即用此值）
VERSION=v1.0.2

# 镜像名（tag = VERSION）
WEB_IMAGE=presurvey-web
API_IMAGE=presurvey-api

# 默认 scope：web（只换前端，最高频；DEPLOY-DESIGN §4）
DEFAULT_SCOPE=web

# CF 下载站（publish 上架目标 / onprem 拉取来源）
CF_DOMAIN=img.mangosv5.app
# 腾讯云源站本地下载目录（publish 在源站机上执行时落地用）
CF_DLDIR=/var/www/dl
