# ─────────────────────────────────────────────────────────────────────────────
# cloud.conf —— 公有云目标（腾讯云测试环境 · x86 / docker compose）（DEPLOY-DESIGN §3 / §4 / §8 P4）
# 部署路线：rsync 工作区 → ssh 远端 docker compose build + up -d（与 onprem 的 docker-run 区分）。
# 环境参数固定（测试环境拓扑稳定，不像内网 onprem 经常变），无需运行时探测。
# ─────────────────────────────────────────────────────────────────────────────

# 架构（远端 x86；compose 在远端本地 build，无需跨架构）
ARCH=amd64

# 编排方式：docker compose（新版 Docker，支持 compose 子命令；区别于 onprem docker-run）
ORCHESTRATOR=docker-compose

# 远端项目根目录下的 compose 文件（rsync 后远端 cd REMOTE_DIR 执行）
COMPOSE_FILE=docker-compose.yml

# 腾讯云测试环境（CF 橙云回源源站同机）
HOST=43.163.3.9
SSH_ALIAS=coder
# 远端项目根目录（rsync 目标 + 远端 docker compose 执行目录）
REMOTE_DIR=/home/ubuntu/pre-survey-map

# 镜像来源：远端本地 build（compose build），不走 CF tar
IMAGE_SOURCE=local-build

# compose 服务名（远端 docker compose build/up 用；scope=web→web，full→web api）
WEB_SVC=web
API_SVC=api
DB_SVC=db
# web 对外端口（curl 验证用；远端 5173→容器 80）
WEB_PORT=5173

# —— DB 连接（migrate 用；通过 docker exec <DB_CTN> psql 连库）——
# 腾讯云测试环境 compose 的 db 容器：库 presurvey / 用户 presurvey（已 ssh 实测确认）。
DB_CTN=presurvey-db
DB_USER=presurvey
DB_NAME=presurvey

# 安全：公有云为测试库，允许清库重来（reset 仍需交互确认；非交互拒绝）
PROD=false
ALLOW_RESET=true
