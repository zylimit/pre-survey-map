# ─────────────────────────────────────────────────────────────────────────────
# local.conf —— 本机内网数据副本（升级演练用）
# 用途：把内网生产库 1:1 灌到本机 compose 环境后，在真实数据上预演 migrate，
#       验证迁移脚本能否在内网现状（无 schema_migrations / V4 前 schema）上跑通。
# 护栏对齐 onprem：PROD=true / ALLOW_RESET=false —— 演练要走与生产同一条代码路径
#（含迁移前二次确认与必建恢复点）。无 TTY 时 confirm 会拒绝，需 script -qec 分配伪终端。
# ─────────────────────────────────────────────────────────────────────────────

ARCH=amd64

# 本机用 root docker-compose.yml 起的三容器
ORCHESTRATOR=docker-compose
COMPOSE_FILE=docker-compose.yml

WEB_CTN=presurvey-web
API_CTN=presurvey-api
WEB_SVC=web
API_SVC=api
DB_SVC=db
WEB_PORT=5173
API_PORT=8000

IMAGE_SOURCE=local-build

# —— DB 连接（migrate 用；docker exec 进 db 容器跑 psql）——
# ⚠️ 与 onprem/cloud 的差异只在 DB_USER：本机 compose 的 .env 用 postgres，内网用 presurvey。
DB_CTN=presurvey-db
DB_USER=postgres
DB_NAME=presurvey

# 🔴 演练同样按生产护栏跑（拒绝 reset；迁移需二次确认）
PROD=true
ALLOW_RESET=false
