# ─────────────────────────────────────────────────────────────────────────────
# onprem.conf —— 内网生产目标（DEPLOY-DESIGN §3 / §4 / §7）
# 🔴 PROD=true / ALLOW_RESET=false —— 脚本对本目标【拒绝任何 reset/truncate/drop】
# 环境参数(NETWORK/WEB_PORT)为【回落默认】；运行时优先自动探测现网（C2 经常变）。
# ─────────────────────────────────────────────────────────────────────────────

# 架构（断言用：build/onprem 镜像必须是 arm64）
ARCH=arm64

# 编排方式：docker run（内网 Docker 18.09 跑不了 compose）
ORCHESTRATOR=docker-run

# 容器命名
WEB_CTN=presurvey-web
API_CTN=presurvey-api

# —— 回落默认（探测失败时用；探测成功以现网为准）——
NETWORK=presurvey-net
WEB_PORT=18080
API_PORT=8000

# 镜像来源：从 CF 下载 tar → docker load（离线/物理隔离）
IMAGE_SOURCE=cf-tar

# —— DB 连接（migrate 用；通过 docker exec <DB_CTN> psql 连库，不依赖宿主 psql/端口暴露）——
# 🔴 内网生产：迁移前必建恢复点；migrate 仅在显式 --migrate-db / migrate 子命令时才碰库。
DB_CTN=presurvey-db
DB_USER=presurvey
DB_NAME=presurvey

# 🔴 安全护栏
PROD=true
ALLOW_RESET=false
