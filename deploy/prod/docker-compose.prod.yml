# pre-survey-map · 内网 ARM64 离线部署 compose
# 用法（内网 ARM 服务器，无外网）：
#   docker load -i presurvey-arm64-images.tar      # 先 load 镜像
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 镜像由腾讯云 x86 buildx 跨架构构建 → save tar → 跳板机搬运到此。
# 与开发 compose 的区别：web/api 用 image:（load 进来的），不 build（服务器拉不到 base 镜像）。

services:
  db:
    image: postgis/postgis:16-3.4          # arm64 镜像（load 进来）
    container_name: presurvey-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-presurvey}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - presurvey_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-presurvey}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: presurvey-api:arm64             # load 进来，不 build
    container_name: presurvey-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-presurvey}
    volumes:
      - ./geo_data:/app/geo_data:ro         # Natural Earth 底图数据（api lifespan 加载）
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    image: presurvey-web:arm64             # load 进来，不 build
    container_name: presurvey-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"               # 内网访问端口（默认 80，被占用改 .env.prod）

volumes:
  presurvey_pgdata:
