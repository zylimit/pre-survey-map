server {
    listen 80;
    server_name _;

    # F1 Spec：单文件上限 100MB（前端 + 后端 + nginx 三端配齐）
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # 反代放最前：确保 /api、/health 优先匹配（regex 按源序首匹配）
    location ~ ^/(api|health) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # F19 (Spec V1.x #23 · 雷 38)：审计日志需要真实客户端 IP；
        # $proxy_add_x_forwarded_for 会追加 $remote_addr 到已有 XFF 链
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传给后端足够时间
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 带 hash 的静态资源 → 长缓存 immutable（文件名带 hash，内容变即换名）
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML → 不缓存：发版即生效，普通刷新就见新版（根治"要无痕"）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
